# The Windows and Linux packages of the version in launcher/src-tauri/tauri.conf.json, published as this repository's release
# v<version>. Run by hand (Actions, or gh workflow run linux-release.yml): a push does not replace the packages of a published version.
#
#   windows   builds the runtime (fefw_rt.dll + .lib, clang-cl) and packs fefw-recomp-<version>-win64.zip
#             (game-build/scripts/build_fefw.ps1, make-release.ps1)
#   linux     makes fefw-recomp-<version>-linux-x64.tar.gz from that zip (game-build/scripts/make-release-linux.sh), then publishes
#             both: added to the release when it exists (same names are replaced), else a new release at this commit
#   decky     the Decky plugin as fefw-recomp-<version>-decky.zip (decky/package.py), published with the packages
# The SteamOS installer (installer/) is published beside them under names without the version, which releases/latest/download finds.
#
# With publish off all of them are only kept as artifacts of the run.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the packages as release v<version> (off: artifacts of this run only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

env:
  # the launcher follows this repository's releases, which are tagged v<version> (update.rs REPO)
  FEFW_UPDATE_REPO: ${{ github.repository }}

jobs:
  windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.names.outputs.version }}
    env:
      # docs/BUILDING.md: LLVM 23 or newer. The runner's own LLVM is older, so this one is unpacked into work\toolchain.
      LLVM_VERSION: 23.1.5
      LLVM_SHA256: b2be33385ddc86e83511417a060de927ae8b09d1f3017cc3cdce5c73cd5029d7
      NX_JOBS: 4
      # keep with make-release-linux.sh (RYUBING_COMMIT) and launcher/src-tauri/src/setup.rs
      RYUBING_COMMIT: a82350bb774f70fcbd41c9987bf67a3775409963
    steps:
      - uses: actions/checkout@v4

      - name: Names
        id: names
        run: |
          $version = (Get-Content -Raw launcher\src-tauri\tauri.conf.json | ConvertFrom-Json).version
          if (-not $version) { throw 'no version in tauri.conf.json' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: LLVM cache
        id: llvm
        uses: actions/cache@v4
        with:
          path: work/toolchain/llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: LLVM ${{ env.LLVM_VERSION }} (clang-cl)
        if: steps.llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p work/toolchain/llvm
          cd work/toolchain
          curl -fsSL -o llvm.tar.zst "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang%2Bllvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.zst"
          echo "$LLVM_SHA256  llvm.tar.zst" | sha256sum -c --quiet
          # the programs and clang's own headers; the static libraries (most of the archive) are not needed
          zstd -dc --long=31 llvm.tar.zst | tar -xf - -C llvm --strip-components=1 --wildcards '*/bin/*' '*/lib/clang/*'
          rm llvm.tar.zst

      - name: Toolchain paths
        run: |
          $bin = (Resolve-Path work\toolchain\llvm\bin).Path
          & "$bin\clang-cl.exe" --version
          "NX_LLVM_BIN=$bin" >> $env:GITHUB_ENV

      # Each part of the package is cached under a key made of the sources it is built from, so a change that touches only the
      # launcher (or only the runtime) rebuilds only that part and reuses the rest.
      #
      # the runtime: the files make-release.ps1 takes from the build, built from runtime/, game-build/fefw, recomp/include and the
      # texture transcoder (its third-party sources are fetched by a script that is part of tools/textures, so they are covered), and
      # tauri.conf.json for the version the DLL names as its release (game-build/fefw/CMakeLists.txt). FEFW_UPDATE_REPO and a fork's
      # FEFW_BUILD_ID are compiled into it too.
      - name: Cache key inputs
        id: ver
        run: |
          # what a cached build also depends on besides the sources: the runner's compilers and SDKs, the .NET SDK, the pinned downloads
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "dotnet=$(dotnet --version)" >> $env:GITHUB_OUTPUT
          $mk = Get-Content -Raw game-build\scripts\make-release.ps1
          $zig = [regex]::Match($mk, '\$ZigVersion = "([^"]+)"').Groups[1].Value
          $py = [regex]::Match($mk, '\$PythonVersion = "([^"]+)"').Groups[1].Value
          if (-not $zig -or -not $py) { throw 'cannot read the Zig and Python versions from make-release.ps1' }
          "downloads=zig$zig-py$py" >> $env:GITHUB_OUTPUT

      - name: Runtime cache
        id: rt
        uses: actions/cache@v4
        with:
          path: |
            game-build/fefw/build/rtdll/fefw_rt.dll
            game-build/fefw/build/rtdll/fefw_rt.pdb
            game-build/fefw/build/rtdll/fefw_rt.lib
            game-build/fefw/build/rtdll/fonts
            game-build/fefw/build/rtdll/astcdec-*-shared.dll
          key: rt-nasm-${{ steps.ver.outputs.image }}-${{ env.LLVM_VERSION }}-${{ env.FEFW_UPDATE_REPO }}-${{ env.FEFW_BUILD_ID }}-${{ hashFiles('runtime/**', 'game-build/fefw/**', 'recomp/include/**', 'tools/textures/**', 'game-build/scripts/build_fefw.ps1', 'launcher/src-tauri/tauri.conf.json') }}

      - name: Texture transcoder sources
        if: steps.rt.outputs.cache-hit != 'true'
        run: pwsh -File tools\textures\scripts\fetch_third_party.ps1

      # sccache keeps the compiled objects between runs, for the runtime changes that do miss the cache above
      - name: sccache
        if: steps.rt.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9

      # dav1d (the AV1 movie decoder) needs NASM for its x86-64 assembly; without it the movies decode several times slower
      - name: NASM (dav1d assembly)
        if: steps.rt.outputs.cache-hit != 'true'
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install nasm failed' }
            $dir = 'C:\Program Files\NASM'
            if (-not (Test-Path "$dir\nasm.exe")) { throw "nasm.exe not found in $dir" }
            $dir >> $env:GITHUB_PATH
            $env:PATH = "$dir;$env:PATH"
          }
          nasm -v

      - name: Runtime (fefw_rt.dll)
        if: steps.rt.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
        # NXRT_DAV1D_ASM=ON makes the configure fail when NASM is missing, instead of building the slow C-only decoder
        run: pwsh -File game-build\scripts\build_fefw.ps1 -Target fefw_rt -BuildDir build\rtdll -CMakeArgs "-DFEFW_RT_DLL=ON -DNXRT_DAV1D_ASM=ON"

      - name: Check the runtime files
        run: |
          foreach ($f in 'fefw_rt.dll', 'fefw_rt.pdb', 'fefw_rt.lib', 'fonts\DejaVuSans.ttf') {
            if (-not (Test-Path "game-build\fefw\build\rtdll\$f")) { throw "the runtime build is missing $f" }
          }

      # fefw_rt.pdb must belong to this fefw_rt.dll: every export of the DLL has to come back from llvm-symbolizer under its own name.
      # Then the DLL and its PDB are packed as fefw-recomp-<version>-win64-symbols.zip, published beside the packages (not in them).
      - name: Symbols (fefw_rt.pdb)
        run: |
          $rt = Resolve-Path game-build\fefw\build\rtdll
          python tools\symbolize.py --self-test "$rt\fefw_rt.dll" --llvm-bin "$env:NX_LLVM_BIN"
          if ($LASTEXITCODE) { throw 'fefw_rt.pdb does not resolve the DLL''s exports' }
          New-Item -ItemType Directory -Force work\release | Out-Null
          $zip = "work\release\fefw-recomp-${{ steps.names.outputs.version }}-win64-symbols.zip"
          Compress-Archive -Force -Path "$rt\fefw_rt.dll", "$rt\fefw_rt.pdb" -DestinationPath $zip

      # the shader translator (dotnet publish of tools/shaders/harness over the pinned Ryujinx sources)
      - name: Shader translator cache
        id: harness
        uses: actions/cache@v4
        with:
          path: work/release/harness
          key: harness-${{ steps.ver.outputs.dotnet }}-${{ env.RYUBING_COMMIT }}-${{ hashFiles('tools/shaders/harness/**', 'tools/shaders/scripts/**') }}

      - name: Shader translator sources (Ryujinx, pinned)
        if: steps.harness.outputs.cache-hit != 'true'
        run: |
          git clone -q --filter=blob:none --no-checkout https://git.ryujinx.app/ryubing/ryujinx.git work\refs\ryubing
          git -C work\refs\ryubing checkout -q $env:RYUBING_COMMIT
          if ($LASTEXITCODE) { throw 'cannot check out the Ryujinx revision' }
          pwsh -File tools\shaders\scripts\setup_ryujinx.ps1 -Ryubing work\refs\ryubing

      # Zig, the Python embeddable package and the wheels make-release.ps1 downloads (it only fetches what is missing)
      - name: Downloads cache
        uses: actions/cache@v4
        with:
          path: work/release/cache
          key: release-downloads-${{ steps.ver.outputs.downloads }}

      - name: Package (game-build/scripts/make-release.ps1)
        run: pwsh -File game-build\scripts\make-release.ps1 -Version ${{ steps.names.outputs.version }}${{ steps.harness.outputs.cache-hit == 'true' && ' -ReuseHarness' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: work/release/fefw-recomp-${{ steps.names.outputs.version }}-win64.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: win64-symbols
          path: work/release/fefw-recomp-${{ steps.names.outputs.version }}-win64-symbols.zip
          compression-level: 0
          if-no-files-found: error

  # the Steam Deck plugin, stamped with the release's version
  decky:
    needs: windows
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    defaults:
      run:
        working-directory: decky
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npx --yes pnpm@9 install --frozen-lockfile
      - run: npx --yes pnpm@9 run check
      - run: npx --yes pnpm@9 test
      - run: npx --yes pnpm@9 run build
      - run: python3 package.py --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: decky
          path: decky/out/fefw-recomp-${{ needs.windows.outputs.version }}-decky.zip
          compression-level: 0
          if-no-files-found: error

  linux:
    needs: [windows, decky]
    # the oldest supported runner: the AppImage and the Python wheels then run on older glibc too
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.windows.outputs.version }}
      TAG: v${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # GitHub's Ubuntu mirror is at times very slow (minutes for these packages), so what apt downloads is kept for later runs: a
      # new cache each week, started from the last one. apt fetches only what the cache lacks.
      - name: Week (names the package cache)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-ubuntu-22.04-${{ steps.week.outputs.week }}
          restore-keys: apt-ubuntu-22.04-

      - name: System packages (Tauri, AppImage)
        run: |
          mkdir -p ~/apt-archives/partial
          apt=(sudo apt-get -o "Dir::Cache::archives=$HOME/apt-archives" -o APT::Keep-Downloaded-Packages=true)
          sudo apt-get update
          "${apt[@]}" install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential file
          "${apt[@]}" autoclean   # drops the versions that have been replaced
          # apt wrote as root; the cache is saved by the runner's user
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Launcher tests
        working-directory: launcher/src-tauri
        run: cargo test --release

      - uses: actions/download-artifact@v4
        with:
          name: win64
          path: work/base

      - uses: actions/download-artifact@v4
        with:
          name: win64-symbols
          path: work/base

      # Zig and the Python build make-release-linux.sh downloads: it only fetches what is missing, and checks both hashes either way.
      # ziglang.org can be very slow (13 minutes seen). The key follows the script's pinned versions and hashes.
      - name: Cache key inputs
        id: ver
        run: |
          pins=$(grep -E '^(ZIG|PYTHON)_[A-Z0-9_]+=' game-build/scripts/make-release-linux.sh)
          echo "downloads=$(printf '%s' "$pins" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Downloads cache
        uses: actions/cache@v4
        with:
          path: work/release/cache
          key: release-linux-downloads-${{ steps.ver.outputs.downloads }}

      # also inside the package: the installed plugin updates itself to it
      - uses: actions/download-artifact@v4
        with:
          name: decky
          path: work/base
      - name: Package (game-build/scripts/make-release-linux.sh)
        run: |
          game-build/scripts/make-release-linux.sh "work/base/fefw-recomp-$VERSION-win64.zip" \
              --decky "work/base/fefw-recomp-$VERSION-decky.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: work/release/fefw-recomp-${{ needs.windows.outputs.version }}-linux-x64.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Installer (installer/), following this repository's releases
        run: |
          sed "s#metrist38/fefw-recomp#$GITHUB_REPOSITORY#g" installer/fefw_install.py > work/base/fefw-recomp-install.py
          sed "s#metrist38/fefw-recomp#$GITHUB_REPOSITORY#g" installer/fefw-recomp-install.desktop > work/base/fefw-recomp-install.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            work/base/fefw-recomp-install.py
            work/base/fefw-recomp-install.desktop
          if-no-files-found: error
      - name: Release
        if: inputs.publish
        run: |
          files=("work/base/fefw-recomp-$VERSION-win64.zip" "work/release/fefw-recomp-$VERSION-linux-x64.tar.gz"
                 "work/base/fefw-recomp-$VERSION-win64-symbols.zip" "work/base/fefw-recomp-$VERSION-decky.zip"
                 "work/base/fefw-recomp-install.py" "work/base/fefw-recomp-install.desktop")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes=$(printf 'Version %s, built from %s.\n\n- **Linux and Steam Deck:** `fefw-recomp-%s-linux-x64.tar.gz`. Extract, run `fefw-launcher.AppImage`, Set up, Play.\n- **SteamOS installer** (Desktop Mode): download `fefw-recomp-install.desktop` and open it. If your browser saves it ending in `.download`, remove that ending.\n- **Windows:** `fefw-recomp-%s-win64.zip`. Extract, run `fefw-launcher.exe`.\n- **Decky plugin** (early; updates and builds from Game Mode): `fefw-recomp-%s-decky.zip`.\n\nSee README.txt in the package.' \
              "$VERSION" "$GITHUB_SHA" "$VERSION" "$VERSION" "$VERSION")
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "$VERSION" --latest=false --notes "$notes"
          fi
          gh release edit "$TAG" --draft=false --latest
